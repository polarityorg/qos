name: stagex-build-push

permissions:
  id-token: write
  contents: read

on:
  workflow_dispatch: # Allows manual invocation

jobs:
  build:
    name: build artifacts
    runs-on: buildjet-32vcpu-ubuntu-2204
    steps:
      - name: Checkout sources
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Setup Docker
        uses: ./.github/actions/docker-setup
      - name: Run `make`
        shell: 'script -q -e -c "bash {0}"'
        run: |
            make -j$(nproc) REGISTRY=${{ steps.login-ecr.outputs.registry }}
            docker push ${{ steps.login-ecr.outputs.registry }}/qos_client
            docker push ${{ steps.login-ecr.outputs.registry }}/qos_host
            docker push ${{ steps.login-ecr.outputs.registry }}/qos_enclave
            docker push ${{ steps.login-ecr.outputs.registry }}/common
